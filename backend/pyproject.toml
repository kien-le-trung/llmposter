[project]
name = "llmposter-backend"
version = "0.1.0"
description = "FastAPI backend for the LLMposter MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5,<2",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=1.0,<2",
    "pydantic-settings>=2.5.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "joblib>=1.4.0",
    "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.setuptools.package-data]
app = ["data/*.json", "prompts/*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.15.20",
    "mlflow>=2.14.0",
    "pyyaml>=6.0.0",
    "wordfreq>=3.1.1",
    "wn>=0.11.0",
]
notebooks = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn==1.7.2",
    "scipy>=1.14.0",
]

[tool.ruff]
cache-dir = "../experiments/artifacts/backend/.ruff_cache"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Preserve the existing rule set independently of Ruff's changing defaults.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
cache_dir = "../experiments/artifacts/backend/.pytest_cache"
testpaths = ["tests"]
